<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Skills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="nav">
    <span class="nav-brand">Open Skills</span>
    <span class="nav-step" id="nav-step">Step 1 · Intent</span>
  </header>

  <main id="app"></main>

  <template id="tpl-intent">
    <section class="page">
      <h1>I keep pasting this procedure…</h1>
      <p class="lede">Describe the messy job in plain language. No gallery, no pack browse — just what you keep redoing.</p>
      <label class="field-label" for="intent">What should this skill do?</label>
      <textarea id="intent" rows="5" placeholder="Every time a teammate asks how we ship a hotfix, I paste the same checklist from Slack: confirm severity, open the runbook, ping on-call, verify rollback… I want a skill that captures that procedure so I stop pasting."></textarea>
      <div class="actions end">
        <button type="button" class="btn btn-primary" id="intent-continue">Continue</button>
      </div>
    </section>
  </template>

  <template id="tpl-methods">
    <section class="page">
      <h1>Pick a method spine</h1>
      <p class="lede">Map Academy Fluency 4Ds into SKILL.md jobs. Choose one to draft first — required before prove-trigger.</p>
      <a class="cite" id="academy-cite" href="https://academy.claude.com/tutorials/the-4-ds-of-ai-fluency-behavioral-indicators" target="_blank" rel="noopener">Cited: Anthropic Academy · Fluency 4Ds — Delegation · Description · Discernment · Diligence (cite only; no invented method prose).</a>
      <div class="methods" id="method-cards"></div>
      <p class="note">Must pick one. Skip / waive only with an explicit waive later — not day-1 hero.</p>
      <div class="actions end">
        <button type="button" class="btn btn-primary" id="methods-continue">Continue to prove trigger</button>
      </div>
    </section>
  </template>

  <template id="tpl-prove">
    <section class="page">
      <h1>Prove the trigger</h1>
      <p class="lede">Non-skippable when / not-when, then should + near-miss should-not prompts. Habit before keep/kill.</p>
      <div class="split">
        <div>
          <label class="field-label tight" for="when">When</label>
          <textarea id="when" rows="3" placeholder="Teammate asks how to ship a hotfix, or you are about to paste the Slack checklist again."></textarea>
        </div>
        <div>
          <label class="field-label tight" for="not-when">Not when</label>
          <textarea id="not-when" rows="3" placeholder="Routine feature deploys, docs-only questions, or when severity is already confirmed and runbook is open."></textarea>
        </div>
      </div>
      <h2 class="subhead">Trigger-proof prompts</h2>
      <div class="prompts" id="prompts"></div>
      <div class="actions end">
        <button type="button" class="btn btn-primary" id="prove-continue">Continue to fill</button>
      </div>
    </section>
  </template>

  <template id="tpl-fill">
    <section class="page">
      <h1 id="fill-title">Fill · Delegation</h1>
      <p class="lede">Current D draft. Regenerate this section or Skip this D (shows as Skipped in preview).</p>
      <div class="chips" id="d-chips"></div>
      <div class="draft">
        <p class="draft-kicker" id="draft-kicker">DELEGATION (draft)</p>
        <div class="draft-body" id="draft-body"></div>
      </div>
      <div class="actions spread">
        <div class="row">
          <button type="button" class="btn btn-ghost" id="fill-skip">Skip this D</button>
          <button type="button" class="btn btn-accent" id="fill-regen">Regenerate section</button>
        </div>
        <button type="button" class="btn btn-primary" id="fill-continue">Continue</button>
      </div>
    </section>
  </template>

  <template id="tpl-preview">
    <section class="page">
      <h1>Preview · then dispose</h1>
      <p class="lede">Read-only SKILL.md. Accept writes to disk. Reject writes nothing. No Save draft hero.</p>
      <div class="preview" id="preview-card"></div>
      <p class="error" id="preview-error" hidden></p>
      <div class="actions end dispose">
        <button type="button" class="btn btn-danger" id="reject">Reject — writes nothing</button>
        <button type="button" class="btn btn-primary" id="accept">Accept — write SKILL.md</button>
      </div>
      <p class="note">Draft is ephemeral until Accept. Reject = zero durable write.</p>
    </section>
  </template>

  <template id="tpl-done-accept">
    <section class="page center">
      <div class="done-card">
        <span class="badge badge-ok">Accepted</span>
        <h1>SKILL.md written</h1>
        <p class="lede">Durable path on disk. Host create can pick up from here — Open Skills gate is done.</p>
        <div class="path-box">
          <p class="draft-kicker">Path</p>
          <p class="path" id="accept-path"></p>
        </div>
        <div class="row">
          <button type="button" class="btn btn-ghost" id="open-folder">Open folder</button>
          <button type="button" class="btn btn-primary" id="accept-done">Done</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-done-reject">
    <section class="page center">
      <div class="done-card">
        <span class="badge badge-no">Rejected</span>
        <h1>Nothing written</h1>
        <p class="lede">Reject = zero durable write. Session draft discarded. Disk unchanged.</p>
        <div class="path-box">
          <p class="draft-kicker">Confirmed</p>
          <p class="path">No SKILL.md on disk. No path. Ephemeral draft cleared.</p>
        </div>
        <div class="row">
          <button type="button" class="btn btn-ghost" id="start-over">Start over</button>
          <button type="button" class="btn btn-primary" id="reject-done">Done</button>
        </div>
      </div>
    </section>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
