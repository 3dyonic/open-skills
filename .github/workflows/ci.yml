name: CI

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: pytest -q
      - name: Academy fetch (non-blocking log)
        run: python -c "from app.academy import fetch_academy_indicators; print(fetch_academy_indicators())"
        continue-on-error: true
